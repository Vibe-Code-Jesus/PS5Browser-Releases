name: Publish native browser package
on:
  push:
    branches: [main]
    paths: ['release.json', '*-Preview.zip', 'publish.py', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-browser-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate package and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish.py --publish
